[package]
name = "vayutool"
version = "0.1.0"
edition = "2021"
description = "POCO X3 Pro (vayu) iOS 27.2 host tooling (inspired by op10tool and oneios-tool)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
